services:
  # ── ClickHouse (OLAP event store) ──
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: gravlytics-clickhouse
    ports:
      - "8123:8123" # HTTP interface
      - "9009:9000" # Native TCP
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_DB: gravlytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: gravlytics_dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - gravlytics-net
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL (metadata store) ──
  postgres:
    image: postgres:16-alpine
    container_name: gravlytics-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB: gravlytics
      POSTGRES_USER: gravlytics
      POSTGRES_PASSWORD: gravlytics_dev
    networks:
      - gravlytics-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gravlytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redpanda (streaming buffer, Kafka API) ──
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.12
    container_name: gravlytics-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --node-id 0
      - --set redpanda.auto_create_topics_enabled=true
    ports:
      - "19092:19092" # Kafka API (external)
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - gravlytics-net
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redpanda Console (web UI, optional) ──
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: gravlytics-redpanda-console
    profiles:
      - monitoring
    ports:
      - "8080:8080"
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - gravlytics-net

  # ── Valkey (cache, Redis-compatible) ──
  valkey:
    image: valkey/valkey:8-alpine
    container_name: gravlytics-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    networks:
      - gravlytics-net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  clickhouse-data:
  postgres-data:
  redpanda-data:
  valkey-data:

networks:
  gravlytics-net:
    driver: bridge
