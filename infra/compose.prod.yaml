services:
  # ── Reverse Proxy (Automatic HTTPS / SSL) ──
  caddy:
    image: caddy:2-alpine
    container_name: gravlytics-caddy
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - gravlytics-net
    depends_on:
      - collector
      - query
      - web

  # ── ClickHouse OLAP Data Store ──
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: gravlytics-clickhouse
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_PORT:-9009}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-gravlytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-gravlytics_dev}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - gravlytics-net
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL Metadata Store ──
  postgres:
    image: postgres:16-alpine
    container_name: gravlytics-postgres
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gravlytics}
      POSTGRES_USER: ${POSTGRES_USER:-gravlytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gravlytics_dev}
    networks:
      - gravlytics-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gravlytics} -d ${POSTGRES_DB:-gravlytics}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redpanda Streaming Buffer ──
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.12
    container_name: gravlytics-redpanda
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --node-id 0
      - --set redpanda.auto_create_topics_enabled=true
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - gravlytics-net
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Valkey Cache ──
  valkey:
    image: valkey/valkey:8-alpine
    container_name: gravlytics-valkey
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    command: >
      sh -c '
        if [ -n "$$VALKEY_PASSWORD" ]; then
          exec valkey-server --requirepass "$$VALKEY_PASSWORD"
        else
          exec valkey-server
        fi
      '
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    networks:
      - gravlytics-net
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$VALKEY_PASSWORD\" ]; then valkey-cli -a \"$$VALKEY_PASSWORD\" ping; else valkey-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Collector Service (Ingestion) ──
  collector:
    build:
      context: ../services/collector
      dockerfile: Dockerfile
    container_name: gravlytics-collector
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      COLLECTOR_PORT: "${COLLECTOR_PORT:-8081}"
      REDPANDA_BROKERS: "${REDPANDA_BROKERS:-redpanda:9092}"
      REDPANDA_TOPIC_EVENTS: "${REDPANDA_TOPIC_EVENTS:-events}"
      REDPANDA_TOPIC_DLQ: "${REDPANDA_TOPIC_DLQ:-events-dlq}"
    ports:
      - "${COLLECTOR_PORT:-8081}:${COLLECTOR_PORT:-8081}"
    networks:
      - gravlytics-net
    depends_on:
      redpanda:
        condition: service_healthy

  # ── Consumer Service (Worker) ──
  consumer:
    build:
      context: ../services/consumer
      dockerfile: Dockerfile
    container_name: gravlytics-consumer
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      REDPANDA_BROKERS: "${REDPANDA_BROKERS:-redpanda:9092}"
      REDPANDA_TOPIC_EVENTS: "${REDPANDA_TOPIC_EVENTS:-events}"
      CLICKHOUSE_HOST: "${CLICKHOUSE_HOST:-clickhouse}"
      CLICKHOUSE_PORT: "${CLICKHOUSE_PORT:-9000}"
      CLICKHOUSE_DB: "${CLICKHOUSE_DB:-gravlytics}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-gravlytics_dev}"
      CONSUMER_GROUP: "${CONSUMER_GROUP:-gravlytics-consumer}"
      CONSUMER_BATCH_SIZE: "${CONSUMER_BATCH_SIZE:-1000}"
      CONSUMER_FLUSH_INTERVAL_MS: "${CONSUMER_FLUSH_INTERVAL_MS:-2000}"
    networks:
      - gravlytics-net
    depends_on:
      clickhouse:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # ── Query API Service ──
  query:
    build:
      context: ../services/query
      dockerfile: Dockerfile
    container_name: gravlytics-query
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      QUERY_PORT: "${QUERY_PORT:-8082}"
      CLICKHOUSE_HOST: "${CLICKHOUSE_HOST:-clickhouse}"
      CLICKHOUSE_PORT: "${CLICKHOUSE_PORT:-9000}"
      CLICKHOUSE_DB: "${CLICKHOUSE_DB:-gravlytics}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-gravlytics_dev}"
      VALKEY_HOST: "${VALKEY_HOST:-valkey}"
      VALKEY_PORT: "${VALKEY_PORT:-6379}"
      VALKEY_PASSWORD: "${VALKEY_PASSWORD:-}"
    ports:
      - "${QUERY_PORT:-8082}:${QUERY_PORT:-8082}"
    networks:
      - gravlytics-net
    depends_on:
      clickhouse:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # ── Web Dashboard (SvelteKit) ──
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: gravlytics-web
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-gravlytics}:${POSTGRES_PASSWORD:-gravlytics_dev}@postgres:5432/${POSTGRES_DB:-gravlytics}"
      VITE_QUERY_API_URL: "http://query:${QUERY_PORT:-8082}"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      PUBLIC_COLLECTOR_URL: "${PUBLIC_COLLECTOR_URL:-http://localhost:8081}"
      PUBLIC_QUERY_API_URL: "${PUBLIC_QUERY_API_URL:-http://localhost:8082}"
    ports:
      - "3000:3000"
    networks:
      - gravlytics-net
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  clickhouse-data:
  postgres-data:
  redpanda-data:
  valkey-data:
  caddy-data:
  caddy-config:

networks:
  gravlytics-net:
    driver: bridge
